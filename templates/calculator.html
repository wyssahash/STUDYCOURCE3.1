{%extends 'base.html'%}

{%block title%}
Калькулятор
{% endblock %}

{%block body%}
    <div class="center-container">
        <h1>Калькулятор</h1>
        <form method="POST">
            <input type="text" name="expression" placeholder="Введите выражение" class="form-control"><br>
            <input type="submit" value="Вычислить" class="btn btn-primary">
        </form>
        {% if result is not none %}
            <h2>Результат: {{ result }}</h2>
        {% endif %}
    </div>
{% endblock %}
